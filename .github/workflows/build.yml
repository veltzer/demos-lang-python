# THIS IS AN AUTO-GENERATED FILE. DO NOT EDIT!
name: build
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: bootstrap-pip
      run: python -m pip install --upgrade pip
    - name: install-rust
      uses: dtolnay/rust-toolchain@stable
    - name: cache-rsconstruct
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/rsconstruct
          ~/.cargo/registry
          ~/.cargo/git
        key: rsconstruct-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
    - name: install-rsconstruct
      run: |
        command -v rsconstruct || cargo install --git https://github.com/veltzer/rsconstruct --locked
        rsconstruct version
    - name: install-tools
      run: rsconstruct tools install-deps --yes
    - name: build
      run: rsconstruct build
    - name: status
      run: rsconstruct status
