# THIS IS AN AUTO-GENERATED FILE. DO NOT EDIT!
name: build
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: bootstrap-pip
      run: python -m pip install --upgrade pip
    - name: install-rsconstruct
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/veltzer/rsconstruct/releases/latest/download/rsconstruct-linux-x86_64" \
          -o "$HOME/.local/bin/rsconstruct"
        chmod +x "$HOME/.local/bin/rsconstruct"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/rsconstruct" version
    - name: install-tools
      run: rsconstruct tools install --yes
    - name: build
      run: rsconstruct build
    - name: status
      run: rsconstruct status
