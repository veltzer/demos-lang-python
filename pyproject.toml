[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pyrefly]
# Third-party packages that are not installed in the build environment
# (or ship without type information) are treated as Any so pyrefly does not
# emit missing-import / missing-attribute errors for them.
replace-imports-with-any = [
    "PyQt5",
    "PyQt5.*",
    "PyRSS2Gen",
    "PyRSS2Gen.*",
