# System (apt) dev libraries required to build the source-only python
# packages from pyproject.toml's [project].dependencies on a clean CI
# runner. Installed by `rsconstruct tool install-deps --yes`.
[dependencies]
system = [
	"pkg-config",
	"libdbus-1-dev",     # dbus-python
	"libdbus-glib-1-dev", # dbus-python (dbus-gmain)
	"libglib2.0-dev",    # dbus-python (gobject)
	"libgirepository1.0-dev", # pygobject / dbus-python introspection
	"libpq-dev",         # psycopg2
	"libasound2-dev",    # simpleaudio
	"libmysqlclient-dev", # mysql-connector / mysqlclient
	"libffi-dev",        # cffi
	"libxml2-dev",       # lxml / pytidylib helpers
	"libxslt1-dev",      # lxml
	"libtidy-dev",       # pytidylib
	"qtbase5-dev",       # pyqt5
	"qtbase5-dev-tools", # pyqt5 (qmake)
	"qttools5-dev",      # pyqt5
	"sip-tools",         # pyqt5 (sip)
	# pygame 2.6.1 (its latest release) ships no cp314 wheel, and the runner is
	# ubuntu-26.04 / Python 3.14, so pip builds it from source and needs the SDL
	# headers. Drop these once pygame ships a cp314 wheel.
	"libsdl2-dev",       # pygame
	"libsdl2-image-dev", # pygame
	"libsdl2-mixer-dev", # pygame
	"libsdl2-ttf-dev",   # pygame
	"libfreetype6-dev",  # pygame (font)
	"libportmidi-dev",   # pygame (midi)
	"libjpeg-dev",       # pygame (image)
	"libpng-dev",        # pygame (image)
]

[processor.checker.pyrefly]
src_dirs = ["src"]
# src_dirs = ["src", "config"]

[processor.checker.make]
src_dirs = ["make_based"]
# the makefiles run Python, which writes bytecode
required_tools = ["python"]
# these makefiles build their demos in place (shared libraries, an embedding
# executable, SWIG wrappers and a setuptools build/ tree); make tracks those
# artifacts itself, so each demo directory is make's to write
sandbox_writable = [
	"make_based/bad_lib",
	"make_based/crashing_python",
	"make_based/embedding_python_in_c",
	"make_based/extending_python_with_c",
]

# [processor.generator.cc_single_file]
# src_dirs = ["src"]
# include_paths = [
# 	"/usr/include/python3.13",
# ]
# src_exclude_dirs = ["/bad_lib/", "/crashing_python/", "/embedding_python_in_c/", "/extending_python_with_c/"]

[analyzer.cpp]
include_paths = [
	"/usr/include/python3.14",
]

# Each directory is one demo program/library built from all its C/C++ files, so one run per directory.
[processor.checker.cppcheck]
dep_inputs = ["cppcheck.cfg"]
batch_by_dir = true
src_dirs = ["make_based"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
	"--library=cppcheck.cfg",
]

[processor.checker.ruff]
src_dirs = ["src"]


[processor.checker.rumdl]
src_dirs = ["src", "make_based", "misc/two_versions_same_lib"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["src"]

[processor.checker.ishellcheck]
src_dirs = ["scripts", "src", "misc"]

[processor.generator.tera]
src_dirs = ["tera.templates"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_files = [".yamllint.yaml"]
src_dirs = [".github", "src/examples/long"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["src/examples/long"]

[analyzer.tera]

# run the tests of the examples with pytest (policy: [tool.pytest.ini_options])
[processor.checker.pytest]
src_dirs = ["src/examples/long/pytest/tests"]
src_files = ["src/examples/short/modules/enum/test_membership.py", "src/exercises/advanced/pytest_with_server_setup_teardown/test_access_server.py"]

# lint the TOML files of the repo with taplo
[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]
