[processor.pyrefly]
src_dirs = ["src"]
# src_dirs = ["src", "config"]

[processor.make]
src_dirs = ["make_based"]

# [processor.cc_single_file]
# src_dirs = ["src"]
# include_paths = [
# 	"/usr/include/python3.13",
# ]
# src_exclude_dirs = ["/bad_lib/", "/crashing_python/", "/embedding_python_in_c/", "/extending_python_with_c/"]

[analyzer.cpp]
include_paths = [
	"/usr/include/python3.14",
]

[processor.cppcheck]
src_dirs = ["make_based"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src", "config"]

[processor.mypy]
src_dirs = ["src", "config"]

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

[processor.shellcheck]
src_dirs = ["scripts", "src", "misc"]

[processor.tera]
dep_inputs = [
    "config/project.py",
    "config/personal.py",
    "config/version.py",
    "config/github.py",
    "config/python.py",
    "config/shared.py",
]
