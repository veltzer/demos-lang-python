# System (apt) dev libraries required to build the source-only python
# packages in requirements.txt on a clean CI runner. Installed by
# `rsconstruct tools install-deps --yes`.
[dependencies]
system = [
	"pkg-config",
	"libdbus-1-dev",     # dbus-python
	"libdbus-glib-1-dev", # dbus-python (dbus-gmain)
	"libglib2.0-dev",    # dbus-python (gobject)
	"libgirepository1.0-dev", # pygobject / dbus-python introspection
	"libpq-dev",         # psycopg2
	"libasound2-dev",    # simpleaudio
	"libmysqlclient-dev", # mysql-connector / mysqlclient
	"libffi-dev",        # cffi
	"libxml2-dev",       # lxml / pytidylib helpers
	"libxslt1-dev",      # lxml
	"libtidy-dev",       # pytidylib
	"qtbase5-dev",       # pyqt5
	"qtbase5-dev-tools", # pyqt5 (qmake)
	"qttools5-dev",      # pyqt5
	"sip-tools",         # pyqt5 (sip)
]
pip = [
	"-r",
	"requirements.txt", # demo libs, so pyrefly resolves imports
]

[processor.pyrefly]
src_dirs = ["src"]
# src_dirs = ["src", "config"]

[processor.make]
src_dirs = ["make_based"]

# [processor.cc_single_file]
# src_dirs = ["src"]
# include_paths = [
# 	"/usr/include/python3.13",
# ]
# src_exclude_dirs = ["/bad_lib/", "/crashing_python/", "/embedding_python_in_c/", "/extending_python_with_c/"]

[analyzer.cpp]
include_paths = [
	"/usr/include/python3.14",
]

[processor.cppcheck]
src_dirs = ["make_based"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src", "config"]

[processor.mypy]
src_dirs = ["src", "config"]

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

[processor.shellcheck]
src_dirs = ["scripts", "src", "misc"]

[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.py",
    "config/personal.py",
    "config/version.py",
    "config/github.py",
    "config/python.py",
    "config/shared.py",
]
