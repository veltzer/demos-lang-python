# System (apt) dev libraries required to build the source-only python
# packages from pyproject.toml's [project].dependencies on a clean CI
# runner. Installed by `rsconstruct tools install-deps --yes`.
[dependencies]
system = [
	"pkg-config",
	"libdbus-1-dev",     # dbus-python
	"libdbus-glib-1-dev", # dbus-python (dbus-gmain)
	"libglib2.0-dev",    # dbus-python (gobject)
	"libgirepository1.0-dev", # pygobject / dbus-python introspection
	"libpq-dev",         # psycopg2
	"libasound2-dev",    # simpleaudio
	"libmysqlclient-dev", # mysql-connector / mysqlclient
	"libffi-dev",        # cffi
	"libxml2-dev",       # lxml / pytidylib helpers
	"libxslt1-dev",      # lxml
	"libtidy-dev",       # pytidylib
	"qtbase5-dev",       # pyqt5
	"qtbase5-dev-tools", # pyqt5 (qmake)
	"qttools5-dev",      # pyqt5
	"sip-tools",         # pyqt5 (sip)
	# pygame 2.6.1 (its latest release) ships no cp314 wheel, and the runner is
	# ubuntu-26.04 / Python 3.14, so pip builds it from source and needs the SDL
	# headers. Drop these once pygame ships a cp314 wheel.
	"libsdl2-dev",       # pygame
	"libsdl2-image-dev", # pygame
	"libsdl2-mixer-dev", # pygame
	"libsdl2-ttf-dev",   # pygame
	"libfreetype6-dev",  # pygame (font)
	"libportmidi-dev",   # pygame (midi)
	"libjpeg-dev",       # pygame (image)
	"libpng-dev",        # pygame (image)
]

[processor.pyrefly]
src_dirs = ["src"]
# src_dirs = ["src", "config"]

[processor.make]
src_dirs = ["make_based"]

# [processor.cc_single_file]
# src_dirs = ["src"]
# include_paths = [
# 	"/usr/include/python3.13",
# ]
# src_exclude_dirs = ["/bad_lib/", "/crashing_python/", "/embedding_python_in_c/", "/extending_python_with_c/"]

[analyzer.cpp]
include_paths = [
	"/usr/include/python3.14",
]

[processor.cppcheck]
src_dirs = ["make_based"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

[processor.ruff]
src_dirs = ["src"]

[processor.pylint]
src_dirs = ["src"]

[processor.mypy]
src_dirs = ["src"]

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

[processor.shellcheck]
src_dirs = ["scripts", "src", "misc"]

[processor.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
