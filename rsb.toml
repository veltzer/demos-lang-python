[processor.pyrefly]
enabled = false
exclude_dirs = [
	"config",
	"not_mine",
	"tests",
	"to_integrate",
]

[processor.make]
exclude_files = ["Makefile"]

[processor.cc_single_file]
include_paths = [
	"/usr/include/python3.13",
]
exclude_dirs = ["/bad_lib/", "/crashing_python/", "/embedding_python_in_c/", "/extending_python_with_c/"]

[analyzer.cpp]
include_paths = [
	"/usr/include/python3.13",
]

[processor.cppcheck]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

[processor.pylint]
exclude_dirs = [
	"config",
	"not_mine",
	"tests",
	"to_integrate",
	"src/examples/long",
]

[processor.mypy]
exclude_dirs = [
	"config",
	"not_mine",
	"tests",
	"to_integrate",
]

[processor.ascii_check]
enabled = false

[processor.rumdl]
enabled = false

[processor.markdownlint]
enabled = false

[processor.clang_tidy]
enabled = false

[processor.mdl]
enabled = false

[processor.marp]
enabled = false

[processor.a2x]
enabled = false
